[project]
name = "intelligent-library-backend"
version = "0.1.0"
description = "Intelligent Library & Reverse Logistics API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy>=2.0.30,<3.0.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0,<2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "openai>=1.35.0",
    "pydantic-ai>=0.0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

